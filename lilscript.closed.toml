# closed LilScript world. The one compiler renames no properties, so extern class
# keys keep their names in this lane too (`mangle.extern_fields` has no effect and
# was removed); the lane stays so a closed-world build is measured on every release.
[javascript]
priority = "size-first"
optimization_level = 13
cost_model = "brotli"
assume_pristine_builtins = false
strip_console = true
candidate_search = "production"

[mangle]
identifiers = true
properties = true
pool_strings = true
