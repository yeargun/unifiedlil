# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[javascript]
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = false
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 13

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true

# All runtime files and format bindings are written by the compiler.
[delivery]
mode = "single"
directory = "."
host_modules = "embed"
select = ["index"]
entry_names = "unified.esm.js"
[delivery.entries]
index = ".tmp/conditions/browser/index.lil"
browser = ".tmp/conditions/browser/browser.lil"
vfile = ".tmp/conditions/browser/vfile.lil"


[[delivery.also]]
name = "browser"
format = "iife"
entries = ["browser"]
exports = "default"
global = "unified"
global_binding = "property"
entry_names = "unified.umd.js"

[[delivery.also]]
name = "vfile-esm"
format = "esm"
entries = ["vfile"]
entry_names = "vfile.esm.js"


[policy.resources]
logical_work = 2000000000

[execution]
jobs = 1
